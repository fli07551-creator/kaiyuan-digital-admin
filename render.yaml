services:
  - type: web
    name: kaiyuan-digital-admin
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
